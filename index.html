
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Joueurs Sans Clan - Clash Royale</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: url('https://i.imgur.com/9Z3HhZp.jpeg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            color: #fff;
        }

        header {
            background: rgba(0,0,0,0.7);
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #f7d44c;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            color: #f7d44c;
            text-shadow: 2px 2px 4px #000;
        }

        main {
            max-width: 950px;
            margin: 30px auto;
            background: rgba(0,0,0,0.75);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #f7d44c;
        }

        h2 {
            color: #f7d44c;
            text-shadow: 1px 1px 3px #000;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input[type="file"] {
            background: #fff;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        button {
            background: #f7d44c;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background: #e0c03d;
        }

        .player-card {
            background: rgba(0,0,0,0.8);
            border: 2px solid #f7d44c;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .player-card h3 {
            margin: 0;
            color: #f7d44c;
        }
