<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Joueurs sans clan - Clash Royale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        header {
            background: #1f2833;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #66fcf1;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #1f2833;
            border-radius: 10px;
        }

        h2 {
            color: #45a29e;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 30px;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #c5c6c7;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        button {
            background: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #45a29e;
        }

        .players-list {
            margin-top: 20px;
        }

        .player-card {
            border: 1px solid #c5c6c7;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 10px;
            background: #0b0c10;
        }

        .player-card h3 {
            margin: 0 0 5px 0;
            color: #66fcf1;
        }

        .qr-preview {
            border: 1px dashed #c5c6c7;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
            color: #c5c6c7;
        }
    </style>
</head>
<body>

<header>
    <h1>Joueurs sans clan - Clash Royale</h1>
    <p>Inscris-toi pour être trouvé par un clan ou créer le tien.</p>
</header>

<main>
    <section>
        <h2>Inscription joueur</h2>
        <form id="playerForm">
            <!-- Pseudo / ID joueur -->
            <div>
                <label for="playerId">ID / Pseudo Clash Royale</label>
                <input type="text" id="playerId" name="playerId" placeholder="Ex : #ABCD1234 ou ton pseudo" required>
            </div>

            <!-- Nombre de trophées -->
            <div>
                <label for="trophies">Trophées</label>
                <input type="number" id="trophies" name="trophies" min="0" placeholder="Ex : 5200" required>
            </div>

            <!-- Arène -->
            <div>
                <label for="arena">Arène</label>
                <select id="arena" name="arena" required>
                    <option value="">Choisir une arène</option>
                    <option value="Arène légendaire">Arène légendaire</option>
                    <option value="Ligue 1">Ligue 1</option>
                    <option value="Ligue 2">Ligue 2</option>
                    <option value="Ligue 3">Ligue 3</option>
                    <option value="Autre">Autre / en dessous</option>
                </select>
            </div>

            <!-- Niveau de tour du roi -->
            <div>
                <label for="kingTower">Niveau tour du roi</label>
                <input type="number" id="kingTower" name="kingTower" min="1" max="16" placeholder="Ex : 14" required>
            </div>

            <!-- QR code ami (URL ou description) -->
            <div class="full-width">
                <label for="qrCode">QR code ami Clash Royale</label>
                <textarea id="qrCode" name="qrCode" placeholder="Colle ici le lien de ton QR code, ou décris où le trouver dans ton profil."></textarea>
                <div class="qr-preview">
                    Ici, tu peux mettre une image de ton QR code (par exemple en l’hébergeant et en mettant le lien),
                    ou le lien direct de ton profil ami Clash Royale.
                </div>
            </div>

            <!-- Bouton -->
            <div class="full-width" style="text-align: center;">
                <button type="submit">S'inscrire</button>
            </div>
        </form>
    </section>

    <section class="players-list">
        <h2>Liste des joueurs sans clan</h2>
        <div id="playersContainer">
            <!-- Les cartes joueurs seront ajoutées ici en JavaScript -->
        </div>
    </section>
</main>

<script>
    const form = document.getElementById('playerForm');
    const playersContainer = document.getElementById('playersContainer');

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        const playerId = document.getElementById('playerId').value;
        const trophies = document.getElementById('trophies').value;
        const arena = document.getElementById('arena').value;
        const kingTower = document.getElementById('kingTower').value;
        const qrCode = document.getElementById('qrCode').value;

        // Création d’une carte joueur
        const card = document.createElement('div');
        card.className = 'player-card';

        card.innerHTML = `
            <h3>${playerId}</h3>
            <p><strong>Trophées :</strong> ${trophies}</p>
            <p><strong>Arène :</strong> ${arena}</p>
            <p><strong>Niveau tour du roi :</strong> ${kingTower}</p>
            ${qrCode ? `<p><strong>QR ami :</strong> ${qrCode}</p>` : ''}
        `;

        playersContainer.appendChild(card);

        // Réinitialiser le formulaire
        form.reset();
    });
</script>

</body>
</html>
