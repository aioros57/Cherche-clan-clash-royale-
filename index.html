<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Joueurs Sans Clan - Clash Royale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #0b0c10;
            margin: 0;
            padding: 0;
            color: #fff;
        }

        header {
            background: #1f2833;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #f7d44c;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            color: #f7d44c;
        }

        main {
            max-width: 1000px;
            margin: 20px auto;
            background: #1f2833;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #f7d44c;
        }

        h2 {
            color: #f7d44c;
            margin-top: 10px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input[type="file"] {
            background: #fff;
            color: #000;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        button {
            background: #f7d44c;
            color: #000;
            font-weight: bold;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #e0c03d;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .controls > div {
            flex: 1 1 150px;
        }

        .player-card {
            background: #0b0c10;
            border: 2px solid #f7d44c;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .player-card h3 {
            margin: 0;
            color: #f7d44c;
        }

        .qr-img {
            max-width: 120px;
            margin-top: 8px;
            border: 2px solid #fff;
            border-radius: 8px;
        }

        @media (max-width: 700px) {
            main {
                margin: 10px;
                padding: 10px;
            }

            form {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: 1 / 2;
            }

            header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Joueurs Sans Clan - Clash Royale</h1>
</header>

<main>
    <section>
        <h2>Inscription</h2>

        <form id="playerForm">
            <div>
                <label>ID / Pseudo Clash Royale</label>
                <input type="text" id="playerId" required>
            </div>

            <div>
                <label>Trophées</label>
                <input type="number" id="trophies" required>
            </div>

            <div>
                <label>Arène</label>
                <select id="arena" required>
                    <option value="">Choisir</option>
                    <option>Arène Légendaire</option>
                    <option>Ligue 1</option>
                    <option>Ligue 2</option>
                    <option>Ligue 3</option>
                    <option>Autre</option>
                </select>
            </div>

            <div>
                <label>Niveau Tour du Roi</label>
                <input type="number" id="kingTower" min="1" max="16" required>
            </div>

            <div>
                <label>Discord (optionnel)</label>
                <input type="text" id="discord" placeholder="Ex : Eric#1234">
            </div>

            <div>
                <label>Messenger (optionnel)</label>
                <input type="text" id="messenger" placeholder="Lien ou nom Messenger">
            </div>

            <div class="full-width">
                <label>QR Code Ami (image)</label>
                <input type="file" id="qrImage" accept="image/*">
            </div>

            <div class="full-width" style="text-align:center;">
                <button type="submit">Ajouter le joueur</button>
            </div>
        </form>
    </section>

    <section>
        <h2>Recherche & Classement</h2>

        <div class="controls">
            <div>
                <label>Recherche par pseudo / ID</label>
                <input type="text" id="searchInput" placeholder="Tape un pseudo ou ID">
            </div>

            <div>
                <label>Filtrer par arène</label>
                <select id="filterArena">
                    <option value="">Toutes</option>
                    <option>Arène Légendaire</option>
                    <option>Ligue 1</option>
                    <option>Ligue 2</option>
                    <option>Ligue 3</option>
                    <option>Autre</option>
                </select>
            </div>

            <div>
                <label>Classement</label>
                <select id="sortBy">
                    <option value="none">Aucun</option>
                    <option value="trophiesDesc">Trophées (↓)</option>
                    <option value="trophiesAsc">Trophées (↑)</option>
                    <option value="kingDesc">Tour du Roi (↓)</option>
                    <option value="kingAsc">Tour du Roi (↑)</option>
                </select>
            </div>
        </div>
    </section>

    <section>
        <h2>Liste des joueurs</h2>
        <div id="playersContainer"></div>
    </section>
</main>

<script>
    const form = document.getElementById('playerForm');
    const playersContainer = document.getElementById('playersContainer');
    const searchInput = document.getElementById('searchInput');
    const filterArena = document.getElementById('filterArena');
    const sortBy = document.getElementById('sortBy');

    let players = [];

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const playerId = document.getElementById('playerId').value.trim();
        const trophies = parseInt(document.getElementById('trophies').value, 10);
        const arena = document.getElementById('arena').value;
        const kingTower = parseInt(document.getElementById('kingTower').value, 10);
        const discord = document.getElementById('discord').value.trim();
        const messenger = document.getElementById('messenger').value.trim();
        const qrFile = document.getElementById('qrImage').files[0];

        let qrURL = null;
        if (qrFile) {
            qrURL = URL.createObjectURL(qrFile);
        }

        players.push({
            playerId,
            trophies,
            arena,
            kingTower,
            discord,
            messenger,
            qrURL
        });

        form.reset();
        renderPlayers();
    });

    searchInput.addEventListener('input', renderPlayers);
    filterArena.addEventListener('change', renderPlayers);
    sortBy.addEventListener('change', renderPlayers);

    function renderPlayers() {
        playersContainer.innerHTML = "";

        let filtered = players.slice();

        const search = searchInput.value.trim().toLowerCase();
        if (search) {
            filtered = filtered.filter(p =>
                p.playerId.toLowerCase().includes(search)
            );
        }

        const arenaFilter = filterArena.value;
        if (arenaFilter) {
            filtered = filtered.filter(p => p.arena === arenaFilter);
        }

        switch (sortBy.value) {
            case "trophiesDesc":
                filtered.sort((a, b) => b.trophies - a.trophies);
                break;
            case "trophiesAsc":
                filtered.sort((a, b) => a.trophies - b.trophies);
                break;
            case "kingDesc":
                filtered.sort((a, b) => b.kingTower - a.kingTower);
                break;
            case "kingAsc":
                filtered.sort((a, b) => a.kingTower - b.kingTower);
                break;
        }

        filtered.forEach(p => {
            const card = document.createElement('div');
            card.className = 'player-card';

            card.innerHTML = `
                <h3>${p.playerId}</h3>
                <p><strong>Trophées :</strong> ${p.trophies}</p>
                <p><strong>Arène :</strong> ${p.arena}</p>
                <p><strong>Tour du Roi :</strong> ${p.kingTower}</p>
                ${p.discord ? `<p><strong>Discord :</strong> ${p.discord}</p>` : ""}
                ${p.messenger ? `<p><strong>Messenger :</strong> ${p.messenger}</p>` : ""}
                ${p.qrURL ? `<img src="${p.qrURL}" class="qr-img">` : ""}
            `;

            playersContainer.appendChild(card);
        });
    }
</script>

</body>
</html>
