<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Joueurs Sans Clan - Clash Royale</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: url('https://i.imgur.com/9Z3HhZp.jpeg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            color: #fff;
        }

        header {
            background: rgba(0,0,0,0.7);
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #f7d44c;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            color: #f7d44c;
            text-shadow: 2px 2px 4px #000;
        }

        main {
            max-width: 950px;
            margin: 30px auto;
            background: rgba(0,0,0,0.75);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #f7d44c;
        }

        h2 {
            color: #f7d44c;
            text-shadow: 1px 1px 3px #000;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input[type="file"] {
            background: #fff;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        button {
            background: #f7d44c;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background: #e0c03d;
        }

        .player-card {
            background: rgba(0,0,0,0.8);
            border: 2px solid #f7d44c;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .player-card h3 {
            margin: 0;
            color: #f7d44c;
        }

        .qr-img {
            max-width: 150px;
            margin-top: 10px;
            border: 2px solid #fff;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<header>
    <h1>Joueurs Sans Clan - Clash Royale</h1>
</header>

<main>
    <section>
        <h2>Inscription</h2>

        <form id="playerForm">
            <div>
                <label>ID / Pseudo Clash Royale</label>
                <input type="text" id="playerId" required>
            </div>

            <div>
                <label>Trophées</label>
                <input type="number" id="trophies" required>
            </div>

            <div>
                <label>Arène</label>
                <select id="arena" required>
                    <option value="">Choisir</option>
                    <option>Arène Légendaire</option>
                    <option>Ligue 1</option>
                    <option>Ligue 2</option>
                    <option>Ligue 3</option>
                    <option>Autre</option>
                </select>
            </div>

            <div>
                <label>Niveau Tour du Roi</label>
                <input type="number" id="kingTower" min="1" max="16" required>
            </div>

            <div>
                <label>Discord (optionnel)</label>
                <input type="text" id="discord" placeholder="Ex : Eric#1234">
            </div>

            <div>
                <label>Messenger (optionnel)</label>
                <input type="text" id="messenger" placeholder="Lien ou nom Messenger">
            </div>

            <div class="full-width">
                <label>QR Code Ami (image)</label>
                <input type="file" id="qrImage" accept="image/*">
            </div>

            <div class="full-width" style="text-align:center;">
                <button type="submit">Ajouter le joueur</button>
            </div>
        </form>
    </section>

    <section>
        <h2>Liste des joueurs</h2>
        <div id="playersContainer"></div>
    </section>
</main>

<script>
    const form = document.getElementById('playerForm');
    const playersContainer = document.getElementById('playersContainer');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const playerId = document.getElementById('playerId').value;
        const trophies = document.getElementById('trophies').value;
        const arena = document.getElementById('arena').value;
        const kingTower = document.getElementById('kingTower').value;
        const discord = document.getElementById('discord').value;
        const messenger = document.getElementById('messenger').value;
        const qrFile = document.getElementById('qrImage').files[0];

        const card = document.createElement('div');
        card.className = 'player-card';

        let qrHTML = "";
        if (qrFile) {
            const imgURL = URL.createObjectURL(qrFile);
            qrHTML = `<img src="${imgURL}" class="qr-img">`;
        }

        card.innerHTML = `
            <h3>${playerId}</h3>
            <p><strong>Trophées :</strong> ${trophies}</p>
            <p><strong>Arène :</strong> ${arena}</p>
            <p><strong>Tour du Roi :</strong> ${kingTower}</p>
            ${discord ? `<p><strong>Discord :</strong> ${discord}</p>` : ""}
            ${messenger ? `<p><strong>Messenger :</strong> ${messenger}</p>` : ""}
            ${qrHTML}
        `;

        playersContainer.appendChild(card);
        form.reset();
    });
</script>

</body>
</html>
